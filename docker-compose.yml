version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: servicedesk-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=servicedesk
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ServiceDesk Full-Stack Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicedesk-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/servicedesk
      - JWT_ACCESS_SECRET=servicedesk_prod_access_secret_key_2026_xyz
      - JWT_REFRESH_SECRET=servicedesk_prod_refresh_secret_key_2026_xyz
      - CORS_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
